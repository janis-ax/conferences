title: ORDIX DOAG 2026
author: ORDIX AG
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, ordix.scss]
      width: 1280
      height: 720
      margin: 0
      center: false
      controls: false
      progress: false
      slide-number: true
      hash: true
      transition: fade
      transition-speed: fast
      embed-resources: true
      smaller: false
      code-line-numbers: false
